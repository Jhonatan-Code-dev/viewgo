name: Go CI Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build, Test & Verify pkg.go.dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Run Unit Tests & Examples
        run: go test -v -race ./...

      - name: Build Application Binary
        run: go build -v -o viewgo ./cmd/viewgo

      - name: Notify pkg.go.dev (On Tag Release)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          curl -s https://proxy.golang.org/github.com/Jhonatan-Code-dev/viewgo/@v/${TAG_NAME}.info

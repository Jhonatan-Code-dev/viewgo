name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v ./...

      - name: Run Benchmarks
        run: go test -bench=. -benchmem ./test
